<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Benchmark de custo — Radar Contatos</title></head>
<body style="font-family:Arial,sans-serif;max-width:820px;margin:40px auto;line-height:1.5">
<h1>Benchmark de custo — Radar Contatos</h1>
<p>Calculadora local para comparar o desenho atual com a política em cascata. Não chama nenhuma API.</p>
<label>Contatos <input id="contacts" type="number" value="600"></label><br><br>
<label>Buscas web por contato no desenho atual <input id="oldSearches" type="number" value="7"></label><br><br>
<label>Buscas web médias no desenho novo <input id="newSearches" type="number" step="0.1" value="1.6"></label><br><br>
<label>% escalados para Terra <input id="terraPct" type="number" value="18"></label><br><br>
<label>% escalados para Sol <input id="solPct" type="number" value="4"></label><br><br>
<button onclick="calc()">Calcular</button>
<pre id="out" style="background:#f4f4f4;padding:18px;margin-top:20px"></pre>
<script>
function calc(){
  const n=+contacts.value, oldS=+oldSearches.value, newS=+newSearches.value;
  const terra=(+terraPct.value)/100, sol=(+solPct.value)/100, luna=Math.max(0,1-terra-sol);
  const webSearchUsdPerCall=0.01; // US$10 / 1000 execuções
  // Hipótese conservadora para comparação: ~2500 tokens entrada + 700 saída por contato.
  const inputM=2500/1e6, outputM=700/1e6;
  const rates={luna:{i:.20,o:1.20},terra:{i:2,o:12},sol:{i:4,o:20}};
  const model=(r)=>n*(inputM*r.i+outputM*r.o);
  const newModel=luna*model(rates.luna)+terra*model(rates.terra)+sol*model(rates.sol);
  const oldSearch=n*oldS*webSearchUsdPerCall;
  const newSearch=n*newS*webSearchUsdPerCall;
  out.textContent=[
    `Contatos: ${n}`,
    `Web search atual (estimado): US$ ${oldSearch.toFixed(2)}`,
    `Web search novo (estimado): US$ ${newSearch.toFixed(2)}`,
    `Modelos novos (estimativa tokens): US$ ${newModel.toFixed(2)}`,
    `Total novo projetado: US$ ${(newSearch+newModel).toFixed(2)}`,
    `Redução só em buscas: ${oldSearch?((1-newSearch/oldSearch)*100).toFixed(1):0}%`,
    '',
    'Observação: é uma estimativa para dimensionamento. O benchmark real deve registrar tokens e chamadas por contato.'
  ].join('\n');
}
calc();
</script>
</body></html>
