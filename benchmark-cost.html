<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Benchmark de custo — Radar Contatos</title></head>
<body style="font-family:Arial,sans-serif;max-width:860px;margin:40px auto;line-height:1.5">
<h1>Benchmark de custo — Radar Contatos</h1>
<p>Calculadora local para dimensionar a nova política server-side. Não chama nenhuma API.</p>
<label>Contatos <input id="contacts" type="number" value="600"></label><br><br>
<label>Web runs médias por contato no desenho atual <input id="oldSearches" type="number" step="0.1" value="2.5"></label><br><br>
<label>Web runs médias por contato no desenho novo <input id="newSearches" type="number" step="0.1" value="1"></label><br><br>
<label>% de contatos que escalam para GPT-5.6 Terra <input id="advancedPct" type="number" value="5"></label><br><br>
<label>Tokens de entrada por contato <input id="inputTokens" type="number" value="2500"></label><br><br>
<label>Tokens de saída por contato <input id="outputTokens" type="number" value="700"></label><br><br>
<label>Custo real do lote anterior (US$) <input id="oldActual" type="number" step="0.01" value="80"></label><br><br>
<button onclick="calc()">Calcular</button>
<pre id="out" style="background:#f4f4f4;padding:18px;margin-top:20px;white-space:pre-wrap"></pre>
<script>
function calc(){
  const n=+contacts.value, oldS=+oldSearches.value, newS=+newSearches.value;
  const advanced=Math.min(1,Math.max(0,(+advancedPct.value)/100));
  const economy=1-advanced;
  const inputM=(+inputTokens.value)/1e6, outputM=(+outputTokens.value)/1e6;
  const webSearchUsdPerCall=0.01;
  const rates={luna:{i:.20,o:1.20},terra:{i:2.00,o:12.00}};
  const perContact=(r)=>inputM*r.i+outputM*r.o;
  const model=n*(economy*perContact(rates.luna)+advanced*perContact(rates.terra));
  const oldSearch=n*oldS*webSearchUsdPerCall;
  const newSearch=n*newS*webSearchUsdPerCall;
  const projected=newSearch+model;
  const oldReal=+oldActual.value;
  out.textContent=[
    `Contatos: ${n}`,
    `Web search atual estimado: US$ ${oldSearch.toFixed(2)}`,
    `Web search novo estimado: US$ ${newSearch.toFixed(2)}`,
    `Inferência nova estimada: US$ ${model.toFixed(2)}`,
    `Total novo projetado: US$ ${projected.toFixed(2)}`,
    `Custo projetado por contato: US$ ${(projected/Math.max(1,n)).toFixed(4)}`,
    oldReal>0 ? `Redução vs. lote real de US$ ${oldReal.toFixed(2)}: ${((1-projected/oldReal)*100).toFixed(1)}%` : '',
    '',
    'Premissas em 07/09/2026: GPT-5.6 Luna US$0,20/M entrada e US$1,20/M saída; GPT-5.6 Terra US$2/M entrada e US$12/M saída; web search US$0,01 por execução.',
    'A estimativa simplificada não separa tokens de conteúdo da busca; o benchmark real usa os dados de usage da API e cache.',
    'Meta operacional: 1 web run no fluxo normal; Terra apenas em exceções/contas estratégicas.'
  ].filter(Boolean).join('\n');
}
calc();
</script>
</body></html>
